$('menuBtn').onclick = showMainMenu;

const inApp = /CursorRemoteApp/.test(navigator.userAgent);
const APK_RELEASE = 'https://github.com/Suchenl/cursor-remote-lite/releases/latest/download/CursorRemote.apk';
// A copy on the user's own GitHub Pages downloads more reliably in mainland China than GitHub Releases.
let apkUrl = APK_RELEASE;
fetch('CursorRemote.apk', { method: 'HEAD' }).then(r => { if (r.ok) apkUrl = new URL('CursorRemote.apk', location.href).href; }).catch(() => {});
const appAddress = () => location.origin + location.pathname.replace(/index\.html$/, '');

// The page itself updates with GitHub Pages; only the Android shell needs a new APK now and then.
const appVersion = /CursorRemoteApp\/v?([\d.]+)/.exec(navigator.userAgent)?.[1];
const newerThan = (a, b) => {
  const x = a.split('.').map(Number), y = b.split('.').map(Number);
  for (let i = 0; i < Math.max(x.length, y.length); i++) if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) > (y[i] || 0);
  return false;
};
const apkUpdate = () => {
  const latest = store.get('apkLatest');
  return appVersion && latest && newerThan(latest, appVersion) ? latest : null;
};
async function checkAppUpdate(manual = false) {
  if (!inApp || !appVersion) return;
  if (!manual && Date.now() - (store.get('apkChecked') || 0) < 6 * 3600e3) return;
  try {
    const r = await fetch('https://api.github.com/repos/Suchenl/cursor-remote-lite/releases/latest', { cache: 'no-store' });
    if (!r.ok) throw new Error();
    store.set('apkLatest', String((await r.json()).tag_name || '').replace(/^v/, ''));
    store.set('apkChecked', Date.now());
  } catch {
    if (manual) status('检查更新失败，请稍后再试', false);
    return;
  }
  if (apkUpdate()) status(`安卓 App 有新版本 v${apkUpdate()}，点右上角「⋯」更新`);
  else if (manual) status('已经是最新版本');
}
function installAppUpdate() {
  if (window.CursorRemoteApp?.update) {
    window.CursorRemoteApp.update(apkUrl);
    status('正在下载新版本，下载完会弹出安装界面');
  }
  // Older shells can't download: an off-site link opens in the system browser instead.
  else location.href = APK_RELEASE;
}

/* ---------- notifications ---------- */
// Android app: its own background listener. Elsewhere: Web Push (iPhone only from the home-screen app).
const nativeNotify = () => Boolean(window.CursorRemoteApp?.setNotify);
const webPush = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let notifyOn = false;

const swReady = () => Promise.race([navigator.serviceWorker.ready, sleep(5000).then(() => { throw new Error('通知组件没有加载，请刷新后再试'); })]);
const pushSub = async () => webPush() ? (await swReady()).pushManager.getSubscription() : null;
const nativeConfig = () => JSON.stringify({ app: appAddress(), key: store.get('key') || '', token: store.get('token') || '' });

// After every connect: refresh the menu state and re-register, since re-pairing gives the device a new id.
async function syncNotify() {
  try {
    if (nativeNotify()) {
      notifyOn = window.CursorRemoteApp.notifyEnabled();
      if (notifyOn) window.CursorRemoteApp.setNotify(nativeConfig());
      return;
    }
    const sub = await pushSub();
    notifyOn = Boolean(sub);
    if (sub) await post('/api/push/subscribe', { sub: sub.toJSON() });
  } catch {}
}

async function enableNotify() {
  if (nativeNotify()) {
    window.CursorRemoteApp.setNotify(nativeConfig());
    notifyOn = true;
    return status('通知已开启。华为等手机请在「设置 → 应用启动管理」里允许本 App 后台活动');
  }
  if (inApp) return status('请先在菜单里更新安卓 App，新版才支持通知', false);
  if (!webPush()) {
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
    return status(ios && !standalone() ? 'iPhone 要先「分享 → 添加到主屏幕」，从桌面图标打开后才能开启通知' : '这个浏览器不支持通知', false);
  }
  // Must be the first await: iOS only shows the permission prompt directly inside a tap.
  const permission = await Notification.requestPermission();
  if (permission !== 'granted') return status('没有通知权限，请在系统设置里允许本 App 发通知', false);
  try {
    const { key } = await api('/api/push/key').then(r => r.json());
    const reg = await swReady();
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(key) });
    const r = await post('/api/push/subscribe', { sub: sub.toJSON() });
    if (!r.ok) throw new Error((await r.json()).error || '注册失败');
    notifyOn = true;
    status('通知已开启');
  } catch (e) {
    status('开启通知失败：' + e.message, false);
  }
}

async function disableNotify() {
  if (nativeNotify()) window.CursorRemoteApp.setNotify('');
  else {
    await (await pushSub().catch(() => null))?.unsubscribe().catch(() => {});
    await post('/api/push/unsubscribe').catch(() => {});
  }
  notifyOn = false;
  status('通知已关闭');
}

function openWin(id) {
  if (!id) return;
  store.set('window', id);
  if (authed) send({ t: 'attach', id });
}
window.openWin = openWin;
navigator.serviceWorker?.addEventListener('message', e => openWin(e.data?.openWin));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') {
    if (authed) send({ t: 'visible', v: false });
    return;
  }
  // Phone OS often freezes/kills background sockets — resume aggressively.
  if (authed) send({ t: 'visible', v: true });
  ensureConnected();
});
window.addEventListener('online', () => { status('网络已恢复，重连中…'); ensureConnected(); });
window.addEventListener('pageshow', e => { if (e.persisted) ensureConnected(); });
document.addEventListener('freeze', () => { try { ws?.send(JSON.stringify({ t: 'ping' })); } catch {} });
document.addEventListener('resume', () => ensureConnected());

async function showInstallHelp() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (ios) {
    let hint = '用 Safari 打开本页 → 点底部「分享」→「添加到主屏幕」。安装后从桌面图标打开。';
    if (store.get('token') && store.get('key') && !standalone()) {
      try {
        status('正在准备主屏幕迁移…');
        const h = await prepareHomeScreenHandoff();
        status('');
        hint = `iPhone 主屏幕与 Safari 存储不通，且图标会按「安装清单」打开，不是随便哪个标签页。<br><br>`
          + `<b>请先长按删除旧桌面图标</b>，再马上做（${h.minutes} 分钟内）：<br>`
          + `1. 保持本页（已生成迁移清单）<br>`
          + `2. 分享 → 添加到主屏幕<br>`
          + `3. 从新图标打开 → 应自动登录<br><br>`
          + `若仍未配对：在主屏幕 App 里粘贴电脑新配对链接。<br>`
          + `<code class="fullLink">${esc(h.url)}</code>`;
      } catch (e) {
        status(e.message || '准备迁移失败', false);
        hint = '生成迁移码失败。也可以：先添加到主屏幕 → 从桌面图标打开 → 再扫电脑上的配对码。';
      }
    } else if (!store.get('token')) {
      hint = '请先「添加到主屏幕」，再从桌面图标打开后扫码配对。<br>若在 Safari 里配对完再添加，主屏幕会是空白，还要再连一次。';
    }
    return openSheet('install', `<h3>安装到桌面</h3><div class="hint">${hint}</div>`);
  }
  openSheet('install', `<h3>安装安卓 App</h3>
    <a class="opt" href="${esc(apkUrl)}"><span class="lbl">下载安卓 App（推荐）</span><span class="tag">APK</span></a>
    <div class="hint">华为等没有谷歌服务的手机、任何浏览器都能装。下载后点开安装（如提示「未知来源」，允许即可）。<br>
      首次打开填入这个地址：</div>
    <button class="opt url" data-act="copyAddress"><span class="lbl url">${esc(appAddress())}</span><span class="tag">复制</span></button>
    ${installEvent ? '<button class="opt" data-act="browserInstall"><span class="lbl">或者：用浏览器安装（需要谷歌服务）</span></button>' : ''}`);
}

$('sheet').addEventListener('click', async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.win) { closeSheet(); return send({ t: 'attach', id: b.dataset.win, agent: b.dataset.agent || '' }); }
  if (b.dataset.kind) { closeSheet(); status('切换中…'); return send({ t: 'pickMenu', kind: b.dataset.kind, label: b.dataset.label }); }
  if (b.dataset.chopen) { closeSheet(); return openFile(b.dataset.chopen, true); }
  if (b.dataset.ch) {
    const act = b.dataset.act2;
    const undo = act === 'undo' || act === 'discard';
    if (undo && !await ask(`撤销「${b.dataset.name}」的改动？\n文件会恢复成改动前的样子。`, '撤销')) return send({ t: 'changes' });
    status(undo ? '正在撤销…' : (act === 'stage' ? '正在暂存…' : '正在保留…'));
    return send({ t: 'change', i: Number(b.dataset.ch), name: b.dataset.name, act });
  }
  if (b.dataset.chbar) {
    const label = changeBarLabel(b.dataset.chbar);
    const risky = /discard|undo|撤销|丢弃/i.test(b.dataset.chbar + label);
    if (risky && !await ask(`确定要「${label}」吗？\n未提交的改动可能被丢掉。`, label)) return send({ t: 'changes' });
    status('处理中…');
    return send({ t: 'change', i: 0, name: b.dataset.chbar, act: 'bar' });
  }
  if ('max' in b.dataset) { status('切换 MAX Mode…'); return send({ t: 'toggleMax' }); }
  if (b.dataset.params) { status('读取模型参数…'); return send({ t: 'params', model: b.dataset.params, label: b.dataset.plabel }); }
  if (b.dataset.section) { status('设置中…'); return send({ t: 'pickParam', model: b.dataset.model, label: b.dataset.plabel, section: b.dataset.section, value: b.dataset.value }); }
  const act = b.dataset.act;
  if (act === 'install') showInstallHelp();
  else if (act === 'browserInstall') { closeSheet(); installEvent?.prompt(); installEvent = null; }
  else if (act === 'copyAddress') {
    await navigator.clipboard?.writeText(appAddress()).then(() => status('已复制地址'), () => status('复制失败，请手动记下地址', false));
  }
  else if (act === 'changeUrl') window.CursorRemoteApp?.changeUrl();
  else if (act === 'notifyOn') { closeSheet(); enableNotify(); }
  else if (act === 'notifyOff') { closeSheet(); disableNotify(); }
  else if (act === 'notifyTest') {
    closeSheet();
    const r = await post('/api/push/test').catch(() => null);
    status(r?.ok ? '已发送测试通知，几秒内应该收到' : '发送失败', Boolean(r?.ok));
  }
  else if (act === 'appUpdate') {
    if (apkUpdate()) { closeSheet(); installAppUpdate(); }
    else { await checkAppUpdate(true); if (apkUpdate()) showMainMenu(); }
  }
  else if (act === 'reconnect') { closeSheet(); ws?.close(); }
  else if (act === 'donate') showDonate();
  else if (act === 'lang') openSheet('lang', '<h3>语言 / Language</h3>'
    + `<button class="opt ${I18N.lang === 'zh' ? 'cur' : ''}" data-act="setLang" data-v="zh"><span class="lbl">中文</span></button>`
    + `<button class="opt ${I18N.lang === 'en' ? 'cur' : ''}" data-act="setLang" data-v="en"><span class="lbl">English</span></button>`);
  else if (act === 'setLang') I18N.set(b.dataset.v);
  else if (act === 'voice') {
    store.set('voice', store.get('voice') === 'on' ? null : 'on');
    document.body.classList.toggle('voice', store.get('voice') === 'on');
    b.querySelector('.switch').classList.toggle('on', store.get('voice') === 'on');
  }
  else if (act === 'devices') showDevices();
  else if (b.dataset.remove) {
    if (!await ask(`移除「${b.dataset.name}」？它会立即断开，要重新配对才能再用。`, '移除')) return showDevices();
    await post('/api/devices/remove', { id: b.dataset.remove }).catch(() => {});
    showDevices();
  }
  else if (act === 'logout') {
    if (!await ask('取消本机配对？之后要在电脑上重新运行 npm run pair 才能再用。', '取消配对')) return;
    await post('/api/logout').catch(() => {});
    store.set('token', null); store.set('key', null);
    authed = false; ws?.close();
  }
});

/* ---------- mode switching ---------- */
function setMode(m) {
  mode = m;
  store.set('mode', m);
  $('tabChat').classList.toggle('on', m === 'chat');
  $('tabScreen').classList.toggle('on', m === 'screen');
  $('chatView').classList.toggle('active', m === 'chat');
  $('screenView').classList.toggle('active', m === 'screen');
  $('chatTools').hidden = m !== 'chat';
  if (authed) send({ t: 'mode', mode: m });
  if (m === 'screen') { layoutStage(); applyQuality(); }
}
$('tabChat').onclick = () => setMode('chat');
$('tabScreen').onclick = () => setMode('screen');

/* ---------- chat view ---------- */
const list = $('list'), itemsEl = $('items');
const cache = new Map();

function buttonsHtml(labels, item) {
  return labels.map((l, n) =>
    `<button class="${PRIMARY.test(l) ? 'primary' : ''}" data-item="${esc(item)}" data-n="${n}" data-label="${esc(l)}">${esc(l)}</button>`).join('');
}

function renderApprovals(list, globalLabels = []) {
  const bar = $('approveBar');
  const actions = $('actionBar');
  const labels = [...new Set([...(list || []).flatMap(a => a.b || []), ...globalLabels])];
  actions.innerHTML = buttonsHtml(labels, 'g');
  actions.classList.toggle('show', labels.length > 0);
  if (!list?.length) {
    bar.innerHTML = '';
    bar.classList.remove('show');
    return;
  }
  bar.innerHTML = list.map(a => {
    // Desktop: title = description / banner title; body = full command or reason.
    const head = (a.title || (a.kind === 'allow' ? '需要确认' : '请求执行命令')).trim();
    const body = (a.detail || '').trim();
    const sum = a.summary && a.summary !== head && a.summary !== body
      ? `<div class="apSum">${esc(a.summary)}</div>` : '';
    // If detail is the same as title, still show once as the command body.
    const detail = body ? `<pre class="apDetail">${esc(body)}</pre>`
      : (head ? `<pre class="apDetail">${esc(head)}</pre>` : '');
    return `<div class="apCard"><div class="apHead">${esc(head)}</div>${sum}${detail}</div>`;
  }).join('');
  bar.classList.add('show');
}

function diffHtml(text) {
  return String(text || '').replace(/\n$/, '').split('\n').map(l => {
    const k = l.startsWith('+') && !l.startsWith('+++') ? 'add' : l.startsWith('-') && !l.startsWith('---') ? 'del' : '';
    return `<div class="dl ${k}">${esc(l) || ' '}</div>`;
  }).join('');
}

const TOOL_ICO = {
  explore: '◎', ran: '›', read: '◉', edit: '✎', search: '⌕', todo: '☰', think: '✧', work: '✧', tool: '•',
};

function processRow(it, title, expandable) {
  const tk = it.tk || (it.k === 'thinking' ? 'think' : 'tool');
  const ico = TOOL_ICO[tk] || TOOL_ICO.tool;
  const chev = expandable ? '<span class="chev">›</span>' : '';
  let txt = esc(title || '');
  if (it.k === 'tool' && it.a) {
    txt = `<span class="act">${esc(it.a)}</span>` + (it.det ? `<span class="det">${esc(it.det)}</span>` : '');
  }
  return `<div class="row">${chev}<span class="ico">${ico}</span><div class="txt">${txt}</div></div>`;
}

function renderItem(it) {
  const el = document.createElement('div');
  const st = it.st || '';
  const tk = it.tk || '';
  const expandable = Boolean(it.x || it.d || it.h || it.f);
  el.className = ['msg', it.k, st, tk ? 'tk-' + tk : '', it.nest ? 'nest' : ''].filter(Boolean).join(' ');
  if (it.k === 'human') el.innerHTML = `<div class="bubble">${esc(it.t || '')}</div>`;
  // it.h comes from the whitelist sanitizer in server.mjs (pageHelpers.clean): plain tags only, text escaped.
  else if (it.k === 'assistant') el.innerHTML = it.h || '';
  else if (it.k === 'meta') el.innerHTML = `<div class="meta">${esc(it.t || '')}</div>`;
  else if (it.k === 'thinking') {
    const head = it.t ? String(it.t).replace(/^thought\s*/i, 'Thought ').replace(/^thinking\s*/i, 'Thinking ') : 'Thinking…';
    el.innerHTML = processRow({ ...it, tk: 'think' }, head, true) + (it.h ? `<div class="think-b">${it.h}</div>` : '<div class="think-b"></div>');
    el.dataset.expand = '1';
  }
  else if (it.k === 'step') {
    const label = it.t || 'Working…';
    const can = expandable || /^(worked|explor|edited|thought|ran)/i.test(label);
    const more = can ? '<div class="more">轻点展开</div>' : '';
    el.innerHTML = processRow(it, label, can) + more + (can ? '<div class="detail"></div>' : '');
    if (can) el.dataset.expand = '1';
  }
  else if (it.k === 'tool') {
    const hasBody = Boolean(it.d);
    const more = hasBody ? '<div class="more">轻点展开</div>' : (it.f || expandable ? '<div class="more">轻点展开详情</div>' : '');
    const body = `<div class="detail${it.diff ? ' diff' : ''}">${hasBody ? (it.diff ? diffHtml(it.d) : esc(it.d)) : ''}</div>`;
    el.innerHTML = processRow(it, it.t || '', expandable) + more + body;
    if (it.f) el.dataset.file = it.f;
    if (hasBody || expandable) el.dataset.detail = '1';
    if (it.diff) el.dataset.diff = '1';
    if (expandable) el.dataset.expand = '1';
  }
  else el.textContent = it.t || '';
  if (it.b && it.k !== 'human' && it.k !== 'meta') el.insertAdjacentHTML('beforeend', `<div class="btns">${buttonsHtml(it.b, it.i)}</div>`);
  return el;
}

const nearBottom = () => list.scrollHeight - list.scrollTop - list.clientHeight < 120;
const openIds = new Set();
let lastChat = null;
let inlineCard = null;

function fillCard(el, html, isDiff) {
  if (!el) return;
  let d = el.querySelector('.detail') || el.querySelector('.think-b');
  if (el.classList.contains('thinking')) {
    d = el.querySelector('.think-b');
    if (!d) { d = document.createElement('div'); d.className = 'think-b'; el.append(d); }
    d.innerHTML = html || '<div class="more">没有读到思考内容</div>';
  } else {
    d = el.querySelector('.detail');
    if (!d) { d = document.createElement('div'); d.className = 'detail'; el.append(d); }
    d.classList.toggle('diff', Boolean(isDiff));
    d.innerHTML = html || '';
    el.dataset.detail = '1';
  }
  el.classList.add('open');
  openIds.add(el.dataset.i);
  const more = el.querySelector('.more');
  if (more) more.remove();
}
function renderChat(chat) {
  if (!chat || !Array.isArray(chat.items)) return;
  if (!chat.items.length && lastChat?.items?.length) return;
  lastChat = chat;
  $('empty').hidden = true;
  $('older').hidden = false;
  $('pickMode').hidden = !chat.mode;
  $('pickModel').hidden = !chat.model;
  if (chat.mode) $('pickMode').textContent = chat.mode + ' ▾';
  if (chat.model) $('pickModel').textContent = chat.model + ' ▾';
  // Clear sticky "切换中…" once the composer reflects the new mode/model.
  if (/^切换中/.test($('msg').textContent || '')) status('');
  const stick = nearBottom();
  // Anchor on the first visible item so loading older messages doesn't jump.
  let anchor = null, anchorTop = 0;
  if (!stick) {
    for (const el of itemsEl.children) {
      if (el.offsetTop + el.offsetHeight > list.scrollTop) { anchor = el.dataset.i; anchorTop = el.offsetTop - list.scrollTop; break; }
    }
  }
  const els = chat.items.map(it => {
    const key = JSON.stringify(it);
    const hit = cache.get(it.i);
    if (hit && hit.key === key) return hit.el;
    const el = renderItem(it);
    el.dataset.i = it.i;
    if (openIds.has(it.i)) el.classList.add('open');
    cache.set(it.i, { key, el });
    return el;
  });
  itemsEl.replaceChildren(...els);
  const live = new Set(chat.items.map(it => it.i));
  for (const k of cache.keys()) if (!live.has(k)) cache.delete(k);

  renderApprovals(chat.approvals || [], chat.global || []);
  renderTodos(chat.todos || []);
  renderQueue(chat.busy, chat.queued || [], chat.subagents || [], chat.readonly, chat.changed);
  renderQuestions(chat.readonly ? null : chat.questions);

  if (stick) list.scrollTop = list.scrollHeight;
  else if (anchor) {
    const el = [...itemsEl.children].find(e => e.dataset.i === anchor);
    if (el) list.scrollTop = el.offsetTop - anchorTop;
  }
  updateToBottom();
}

let subsOpen = false;

function renderTodos(list) {
  const bar = $('todoBar');
  if (!list?.length) { bar.innerHTML = ''; bar.classList.remove('show'); return; }
  const mark = { done: '✓', doing: '►', pending: '○', cancelled: '×' };
  bar.innerHTML = `<div class="th">Todos ${list.filter(t => t.s === 'done').length}/${list.length}</div>`
    + list.map(t => `<div class="ti ${esc(t.s || 'pending')}"><b>${mark[t.s] || '○'}</b><span>${esc(t.t || '')}</span></div>`).join('');
  bar.classList.add('show');
}

// The Agent's ask-question tool: a card with the questions, options, a free-text answer and submit / skip.
let qnSig = '';
function renderQuestions(qs) {
  const bar = $('qnBar');
  const sig = JSON.stringify(qs);
  if (sig === qnSig) return;
  qnSig = sig;
  if (!qs?.list?.length) { bar.innerHTML = ''; bar.classList.remove('show'); return; }
  bar.innerHTML = `<div class="qnHead">❓ Agent 在问你${qs.list.length > 1 ? `（${qs.list.length} 个问题）` : ''}</div>`
    + qs.list.map((q, qi) => `<div class="qnQ">${qs.list.length > 1 ? `${qi + 1}. ` : ''}${esc(q.text)}</div><div class="qnOpts">`
      + q.options.map((o, oi) => {
        const letter = String.fromCharCode(65 + oi);
        return o.free
          ? `<div class="qnFree ${o.sel ? 'on' : ''}"><input data-qi="${qi}" data-oi="${oi}" placeholder="其他…" value="${esc(o.value)}" enterkeyhint="done"><button data-qfree="${qi}:${oi}">填入</button></div>`
          : `<button class="qnOpt ${o.sel ? 'on' : ''}" data-qi="${qi}" data-oi="${oi}"><b>${letter}</b><span>${esc(o.label)}</span></button>`;
      }).join('') + '</div>').join('')
    + `<div class="qnAct"><button data-qpart="skip">跳过</button><button class="primary" data-qpart="submit" ${qs.canSubmit ? '' : 'disabled'}>提交</button></div>`;
  bar.classList.add('show');
}

$('qnBar').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.qpart) { status(b.dataset.qpart === 'skip' ? '已跳过' : '已提交'); return send({ t: 'question', part: b.dataset.qpart }); }
  if (b.dataset.qfree) {
    const [qi, oi] = b.dataset.qfree.split(':').map(Number);
    return send({ t: 'question', qi, oi, part: 'option', text: b.previousElementSibling.value });
  }
  if (b.dataset.qi) send({ t: 'question', qi: Number(b.dataset.qi), oi: Number(b.dataset.oi), part: 'option' });
};
$('qnBar').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.matches('input')) return;
  e.preventDefault();
  e.target.nextElementSibling.click();
});

function renderQueue(busy, queued, subs = [], readonly = false, changed = 0) {
  const bar = $('queueBar');
  let html = '';
  if (readonly) html += `<div class="run sub"><span>正在查看子 Agent 的对话（只读）</span><button data-main>返回主对话</button></div>`;
  if (subs.length && !readonly) {
    html += `<button class="qh fold" data-fold>${subsOpen ? '▾' : '▸'} <span>子 Agent 运行中 ${subs.length} 个</span></button>`;
    if (subsOpen) html += subs.map(n => `<div class="q"><span class="qt sa">${esc(n)}</span>`
      + `<button data-sub="${esc(n)}" data-part="open">查看</button><button data-sub="${esc(n)}" data-part="stop">停止</button></div>`).join('');
  }
  if (busy && !readonly) html += `<div class="run"><i></i><span>Agent 正在运行${queued.length ? '，下面的消息会在这一轮结束后依次发送' : '，现在发的消息会先排队'}</span><button data-stop>停止</button></div>`;
  if (queued.length) {
    html += `<div class="qh">排队中 ${queued.length} 条</div>`;
    html += queued.map(q => `<div class="q"><span class="qt">${esc(q.t || '(空)')}</span>`
      + `<button data-q="${esc(q.id)}" data-a="edit">修改</button>`
      + `<button data-q="${esc(q.id)}" data-a="send" title="打断当前这一轮，立刻发送">立即发送</button>`
      + `<button data-q="${esc(q.id)}" data-a="remove">删除</button></div>`).join('');
  }
  if (changed && !readonly) html += `<button class="qh fold" data-changes>改动了 ${changed} 个文件 ›</button>`;
  bar.innerHTML = html;
  bar.classList.toggle('show', Boolean(html));
}

function editQueued(id) {
  const q = (lastChat?.queued || []).find(x => x.id === id);
  if (!q) return status('这条排队消息已经不在了', false);
  openSheet('queueEdit', `<h3>修改排队消息</h3>
    <textarea id="qEdit" style="width:100%;box-sizing:border-box;min-height:120px;max-height:50dvh;margin-bottom:10px"></textarea>
    <button class="opt" id="qSave" style="justify-content:center;background:#0e639c;border-color:#1177bb;color:#fff;font-weight:600">保存（仍在排队）</button>`);
  $('qEdit').value = q.t;
  $('qSave').onclick = () => {
    const v = $('qEdit').value;
    if (!v.trim()) return status('内容不能为空；不想要这条就点「删除」', false);
    send({ t: 'queue', id, action: 'edit', text: v });
    closeSheet();
    status('正在修改排队消息…');
  };
}

$('queueBar').onclick = async e => {
  const b = e.target.closest('button');
  if (!b) return;
  if ('changes' in b.dataset) { status('读取改动的文件…'); return send({ t: 'changes' }); }
  if ('fold' in b.dataset) { subsOpen = !subsOpen; return renderQueue(lastChat?.busy, lastChat?.queued || [], lastChat?.subagents || [], lastChat?.readonly, lastChat?.changed); }
  if ('stop' in b.dataset) {
    if (!await ask('停止 Agent？\n它这一轮正在做的事会中断。', '停止')) return;
    send({ t: 'stop' }); status('已停止 Agent'); return;
  }
  if ('main' in b.dataset) { send({ t: 'mainChat' }); status('返回主对话…'); return; }
  if (b.dataset.sub) {
    if (b.dataset.part === 'stop' && !await ask(`停止子 Agent「${b.dataset.sub}」？\n它做到一半的工作会中断。`, '停止')) return;
    send({ t: 'subagent', name: b.dataset.sub, part: b.dataset.part });
    status(b.dataset.part === 'stop' ? '已停止子 Agent' : '正在打开子 Agent…');
    if (b.dataset.part === 'open') list.scrollTop = list.scrollHeight;
    return;
  }
  if (b.dataset.a === 'edit') return editQueued(b.dataset.q);
  if (b.dataset.a === 'send' && !await ask('立即发送这条消息？\nAgent 当前这一轮会被打断。', '立即发送')) return;
  if (b.dataset.a === 'remove' && !await ask('删除这条排队消息？', '删除')) return;
  send({ t: 'queue', id: b.dataset.q, action: b.dataset.a });
  status(b.dataset.a === 'send' ? '已立即发送这条排队消息' : '已删除这条排队消息');
};

function updateToBottom() {
  $('toBottom').style.display = nearBottom() ? 'none' : 'block';
}
list.addEventListener('scroll', updateToBottom);
$('toBottom').onclick = () => { list.scrollTop = list.scrollHeight; };
$('older').onclick = () => {
  const b = $('older');
  if (b.disabled) return;
  b.disabled = true;
  const prev = b.textContent;
  b.textContent = '加载中…';
  status('正在加载更早的消息…');
  send({ t: 'scrollChat', dy: -900 });
  setTimeout(() => {
    b.disabled = false;
    b.textContent = prev || '↑ 加载更早的消息';
    if (/正在加载更早/.test($('msg')?.textContent || '')) status('');
  }, 1200);
};

document.addEventListener('click', async e => {
  const card = e.target.closest('#items .msg.tool, #items .msg.thinking, #items .msg.step');
  if (card && !e.target.closest('button')) {
    e.preventDefault();
    const opening = !card.classList.contains('open');
    card.classList.toggle('open');
    if (card.classList.contains('open')) openIds.add(card.dataset.i);
    else openIds.delete(card.dataset.i);
    if (!opening) return;
    const body = card.querySelector('.detail, .think-b');
    const has = body && body.innerHTML.trim();
    if (has) return;
    const more = card.querySelector('.more');
    if (more) more.textContent = '正在读取…';
    else if (card.classList.contains('step') || card.classList.contains('tool')) {
      const hint = document.createElement('div');
      hint.className = 'more';
      hint.textContent = '正在读取…';
      card.append(hint);
    }
    if (card.dataset.file && card.classList.contains('tool')) {
      inlineCard = card;
      return openFile(card.dataset.file, card.dataset.diff === '1' || /edited|wrote|updated/i.test(card.textContent || ''), true);
    }
    send({ t: 'expand', item: card.dataset.i });
    return;
  }
  // File refs in assistant markdown.
  const f = e.target.closest('#items [data-file]');
  if (f?.dataset.file && !f.classList.contains('tool')) {
    e.preventDefault();
    inlineCard = null;
    return openFile(f.dataset.file);
  }
  const b = e.target.closest('button[data-item]');
  if (!b) return;
  const label = b.textContent.trim();
  const msg = b.closest('.msg');
  const file = msg?.dataset.file || '';
  if (file && /^(read|edited|view|打开|open|show|查看|编辑)/i.test(label)) {
    e.preventDefault();
    return openFile(file);
  }
  if (RISKY.test(label) && !await ask(`确定要点「${label}」吗？`, label)) return;
  send({ t: 'click', item: b.dataset.item, n: Number(b.dataset.n), label: b.dataset.label || label });
  status('已点击：' + label);
});

$('pickMode').onclick = () => { status('读取模式列表…'); send({ t: 'openMenu', kind: 'mode' }); };
$('pickModel').onclick = () => { status('读取模型列表…'); send({ t: 'openMenu', kind: 'model' }); };
$('pickHistory').onclick = () => { status('读取历史对话…'); send({ t: 'openMenu', kind: 'history' }); };
$('newChat').onclick = () => { send({ t: 'newChat' }); status('已新建对话'); };

/* ---------- file viewer ---------- */
$('vBody').classList.toggle('wrap', store.get('wrap') !== 'off');
$('vWrap').classList.toggle('on', store.get('wrap') !== 'off');

function ensureViewer() {
  $('viewer').classList.add('open');
}

function openFile(ref, asDiff = false, inline = false) {
  if (!ref) return;
  if (!inline) {
    closeSheet();
    ensureViewer();
    $('vName').textContent = String(ref).split(/[/\\]/).pop();
    $('vPath').textContent = '';
    $('vBody').innerHTML = `<div class="note">${asDiff ? '正在读取改动…' : '正在从电脑读取…'}</div>`;
  }
  status(asDiff ? '正在读取改动…' : '正在读取文件…');
  send({ t: 'file', path: ref, diff: Boolean(asDiff) });
}

function showInlineFile(m) {
  const el = inlineCard;
  if (!el) return showFile(m);
  if (m.loading) {
    const more = el.querySelector('.more');
    if (more) more.textContent = '正在读取…';
    return;
  }
  status('');
  if (m.error) {
    fillCard(el, `<div class="note err">${esc(m.error)}</div>`);
    return;
  }
  if (m.image) {
    fillCard(el, `<img src="${m.image}" alt="" style="max-width:100%">`);
    return;
  }
  if (m.text == null) {
    fillCard(el, '<div class="note err">没有读到文件内容</div>');
    return;
  }
  if (m.diff) {
    fillCard(el, diffHtml(m.text), true);
    return;
  }
  const lines = String(m.text).replace(/\n$/, '').split('\n');
  const start = Math.max(0, (m.line || 1) - 8);
  const slice = lines.slice(start, start + 80);
  fillCard(el, slice.map((l, i) => {
    const n = start + i + 1;
    return `<div class="dl${n === m.line ? ' add' : ''}">${esc(String(n).padStart(4) + '  ' + l) || ' '}</div>`;
  }).join('') + (lines.length > 80 ? '<div class="more">轻点文件名可看全文</div>' : ''));
}

function showFile(m) {
  ensureViewer();
  if (m.loading) {
    $('vName').textContent = m.name || $('vName').textContent;
    $('vBody').innerHTML = '<div class="note">正在从电脑读取…</div>';
    return;
  }
  status('');
  $('vName').textContent = m.name || '';
  // Leading LRM keeps the rtl ellipsis from reordering the path's slashes.
  $('vPath').textContent = m.path ? '\u200e' + (m.host ? m.host + ':' : '') + m.path + (m.size != null ? ` · ${fmtSize(m.size)}` : '') : '';
  const body = $('vBody');
  if (m.error) {
    body.innerHTML = `<div class="note err">${esc(m.error)}</div><div class="note">可以切到「画面」在 Cursor 里打开</div>`;
    return;
  }
  if (m.image) {
    body.innerHTML = '';
    const img = new Image();
    img.src = m.image;
    body.append(img);
    return;
  }
  if (m.text == null) {
    body.innerHTML = '<div class="note err">没有读到文件内容</div>';
    return;
  }
  if (m.diff) {
    $('vPath').textContent = (m.path ? '\u200e' + (m.host ? m.host + ':' : '') + m.path : '') + ' · 改动';
    body.innerHTML = `<div class="diff">${diffHtml(m.text)}</div>`
      + (m.truncated ? '<div class="note">改动太长，只显示了前 512 KB</div>' : '')
      + (m.path ? '<div class="note">点左上角返回后，再点文件名以外的地方可看全文</div>' : '');
    body.scrollTop = 0;
    return;
  }
  const lines = String(m.text).replace(/\n$/, '').split('\n');
  body.innerHTML = `<div class="code">${lines.map((l, n) =>
    `<div class="l${n + 1 === m.line ? ' hl' : ''}"><i>${n + 1}</i>${esc(l) || ' '}</div>`).join('')}</div>`
    + (m.truncated ? '<div class="note">文件太长，只显示了前 512 KB</div>' : '');
  body.scrollTop = 0;
  if (m.line) body.querySelector('.hl')?.scrollIntoView({ block: 'center' });
}

const fmtSize = n => n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(1) + ' KB' : (n / 1048576).toFixed(1) + ' MB';

function closeViewer() {
  $('viewer').classList.remove('open');
  $('vBody').innerHTML = '';
}
$('vClose').onclick = () => closeViewer();
$('vWrap').onclick = () => {
  const on = !$('vBody').classList.contains('wrap');
  $('vBody').classList.toggle('wrap', on);
  $('vWrap').classList.toggle('on', on);
  store.set('wrap', on ? null : 'off');
};

/* ---------- screen view ---------- */
const view = $('view'), stage = $('stage'), screen = $('screen');

function onFrame(m) {
  const resized = m.w !== frame.w || m.h !== frame.h;
  frame = { w: m.w, h: m.h };
  screen.src = 'data:image/jpeg;base64,' + m.data;
  layoutStage();
  if (resized) applyQuality();
}
screen.onload = () => send({ t: 'ack' });

const cropRect = () => crop && panel ? panel : [0, 0, frame.w, frame.h];

function layoutStage() {
  if (mode !== 'screen') return;
  const [rx, ry, rw, rh] = cropRect();
  const stageW = view.clientWidth * zoom;
  const scale = stageW / rw;
  stage.style.width = stageW + 'px';
  stage.style.height = rh * scale + 'px';
  screen.style.width = frame.w * scale + 'px';
  screen.style.left = -rx * scale + 'px';
  screen.style.top = -ry * scale + 'px';
}

let sentWidth = 0;
function applyQuality() {
  if (mode !== 'screen' || !authed) return;
  const [, , rw] = cropRect();
  const px = Math.min(2560, Math.round(view.clientWidth * zoom * devicePixelRatio * frame.w / rw));
  if (Math.abs(px - sentWidth) < 40) return;
  sentWidth = px;
  send({ t: 'quality', quality: 70, maxWidth: px });
}

function setCrop(on) {
  crop = on;
  store.set('crop', on ? 'panel' : 'full');
  $('cropPanel').classList.toggle('on', on);
  $('cropFull').classList.toggle('on', !on);
  layoutStage(); applyQuality();
}
$('cropPanel').onclick = () => setCrop(true);
$('cropFull').onclick = () => setCrop(false);

function norm(e) {
  const r = screen.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
}

function ripple(e) {
  const r = stage.getBoundingClientRect(), el = $('ripple');
  el.style.left = (e.clientX - r.left) + 'px';
  el.style.top = (e.clientY - r.top) + 'px';
  el.style.transition = 'none'; el.style.opacity = 1;
  requestAnimationFrame(() => { el.style.transition = 'opacity .4s'; el.style.opacity = 0; });
}

let down = null;
screen.addEventListener('pointerdown', e => {
  down = { x: e.clientX, y: e.clientY, t: Date.now(), lastY: e.clientY, lastX: e.clientX, moved: false };
});
screen.addEventListener('pointermove', e => {
  if (!down) return;
  if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) down.moved = true;
  if (tapMode === 'scroll' && down.moved) {
    const scale = frame.w / screen.getBoundingClientRect().width;
    const dy = (down.lastY - e.clientY) * scale * 1.5, dx = (down.lastX - e.clientX) * scale * 1.5;
    down.lastY = e.clientY; down.lastX = e.clientX;
    const p = norm(down);
    send({ t: 'wheel', x: p.x, y: p.y, dx, dy });
  }
});
screen.addEventListener('pointerup', e => {
  if (!down) return;
  const longPress = Date.now() - down.t > 600;
  if (!down.moved) {
    const p = norm(e);
    const button = rightNext || longPress ? 'right' : 'left';
    rightNext = false; $('rightClick').classList.remove('on');
    send({ t: 'tap', x: p.x, y: p.y, button });
    ripple(e);
  }
  down = null;
});
screen.addEventListener('pointercancel', () => { down = null; });
screen.addEventListener('contextmenu', e => e.preventDefault());

function setTapMode(m) {
  tapMode = m;
  $('modeTap').classList.toggle('on', m === 'tap');
  $('modeScroll').classList.toggle('on', m === 'scroll');
  view.classList.toggle('scroll', m === 'scroll');
}
$('modeTap').onclick = () => setTapMode('tap');
$('modeScroll').onclick = () => setTapMode('scroll');

const ZOOMS = [1, 1.5, 2, 3];
$('zoom').onclick = () => {
  const cx = (view.scrollLeft + view.clientWidth / 2) / (view.scrollWidth || 1);
  const cy = (view.scrollTop + view.clientHeight / 2) / (view.scrollHeight || 1);
  zoom = ZOOMS[(ZOOMS.indexOf(zoom) + 1) % ZOOMS.length];
  $('zoom').textContent = zoom + 'x';
  layoutStage();
  view.scrollLeft = cx * view.scrollWidth - view.clientWidth / 2;
  view.scrollTop = cy * view.scrollHeight - view.clientHeight / 2;
  applyQuality();
};
$('refresh').onclick = () => send({ t: 'refresh' });
$('rightClick').onclick = () => { rightNext = !rightNext; $('rightClick').classList.toggle('on', rightNext); };
document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => send({ t: 'key', key: b.dataset.key }));

/* ---------- composer ---------- */
const text = $('text');
function autosize() { text.style.height = 'auto'; text.style.height = text.scrollHeight + 'px'; }
text.addEventListener('input', autosize);
$('send').onclick = () => {
  const v = text.value;
  if (!v.trim()) return;
  send({ t: 'send', text: v, submit: true });
  text.value = ''; autosize();
  if (mode === 'chat') list.scrollTop = list.scrollHeight;
};

/* ---------- voice input ---------- */
// Android WebView has no Web Speech API, so the app uses the system recognizer through the bridge instead.
document.body.classList.toggle('voice', store.get('voice') === 'on');
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
const addVoiceText = s => {
  text.value += (text.value && !/\s$/.test(text.value) && /^\w/.test(s) ? ' ' : '') + s;
  autosize();
};
window.onVoice = s => { $('mic').classList.remove('on'); s ? (addVoiceText(s), status('')) : status('没听清，再试一次', false); };
// Photos from phone cameras are several MB; shrink to something the model can read and the relay accepts.
async function shrinkImage(file) {
  if (/^image\/(png|jpeg|gif|webp)$/.test(file.type) && file.size < 600e3) return file;
  const bmp = await createImageBitmap(file);
  let side = 1600, q = 0.85, blob;
  do {
    const k = Math.min(1, side / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    side *= 0.75; q -= 0.1;
  } while (blob.size > 1.5e6 && q > 0.4);
  return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
}

$('img').onclick = () => $('imgFile').click();
$('imgFile').onchange = async () => {
  const file = $('imgFile').files[0];
  $('imgFile').value = '';
  if (!file) return;
  status('正在处理图片…');
  try {
    const img = await shrinkImage(file);
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(img); });
    send({ t: 'image', data: url.slice(url.indexOf(',') + 1), name: img.name, type: img.type });
  } catch {
    status('读不了这张图片，换一张试试', false);
  }
};

$('mic').onclick = () => {
  if (window.CursorRemoteApp?.voice) {
    if (!window.CursorRemoteApp.voice(I18N.speech)) return status('手机上没有语音识别服务，可以用输入法键盘上的麦克风', false);
    $('mic').classList.add('on');
    return status('请说话…');
  }
  if (inApp) return status('更新安卓 App 后可用语音输入，也可以用输入法键盘上的麦克风', false);
  if (!Recognition) return status('这个浏览器不支持语音识别，可以用输入法键盘上的麦克风', false);
  if (recognizer) return recognizer.stop();
  const before = text.value;
  recognizer = new Recognition();
  recognizer.lang = I18N.speech;
  recognizer.interimResults = true;
  recognizer.onresult = e => {
    text.value = before;
    addVoiceText([...e.results].map(r => r[0].transcript).join(''));
  };
  recognizer.onerror = e => status(
    e.error === 'not-allowed' || e.error === 'service-not-allowed' ? '没有麦克风权限'
      : e.error === 'network' ? '语音识别连不上服务器（国内网络常见），可以用输入法键盘上的麦克风'
      : e.error === 'no-speech' ? '没听清，再试一次' : e.error, false);
  recognizer.onend = () => { recognizer = null; $('mic').classList.remove('on'); };
  recognizer.start();
  $('mic').classList.add('on');
  status('请说话…（再点一下结束）');
};

window.addEventListener('resize', () => { layoutStage(); applyQuality(); });
if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(() => {});

// Ensure "Add to Home Screen" opens this app dir (not github.io root) even without the install wizard.
setInstallManifest('./');

setCrop(crop);
setMode(mode);
boot();
</script>
</body>
</html>
