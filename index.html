<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cursor Remote">
<meta name="theme-color" content="#1e1e1e">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cursor Remote</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: #1e1e1e; color: #d4d4d4; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { position: fixed; left: 0; top: 0; width: 100%; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  button, select, textarea, input { font: inherit; color: #e6e6e6; background: #2d2d2d; border: 1px solid #3c3c3c; border-radius: 8px; }
  button { padding: 6px 12px; white-space: nowrap; cursor: pointer; }
  button:active { filter: brightness(1.3); }
  button.on, button.primary { background: #0e639c; border-color: #1177bb; color: #fff; }
  [hidden] { display: none !important; }

  header { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #252526; border-bottom: 1px solid #333; min-width: 0; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #c33; flex: none; }
  #dot.ok { background: #3c3; }
  #title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px; background: none; border: none; padding: 4px 2px; text-align: left; color: #ccc; font-size: 14px; }
  #title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #title::after { content: "▾"; color: #888; flex: none; }
  .seg { display: flex; flex: none; border: 1px solid #3c3c3c; border-radius: 8px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; padding: 5px 12px; background: #2d2d2d; }
  .seg button.on { background: #0e639c; }
  #menuBtn { flex: none; padding: 5px 10px; }

  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; display: none; flex-direction: column; min-width: 0; }
  .view.active { display: flex; }

  /* chat view */
  #list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px 12px 16px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #older { display: block; margin: 0 auto 10px; font-size: 13px; color: #aaa; background: transparent; }
  .msg { margin: 8px 0; min-width: 0; overflow-wrap: anywhere; }
  .human { display: flex; justify-content: flex-end; }
  .human .bubble { max-width: 88%; background: #264f78; color: #fff; padding: 8px 12px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
  .assistant { padding: 2px 2px; }
  .assistant p { margin: 0 0 .6em; }
  .assistant ul, .assistant ol { margin: 0 0 .6em; padding-left: 1.3em; }
  .assistant h1, .assistant h2, .assistant h3, .assistant h4 { font-size: 1.05em; margin: .8em 0 .4em; }
  .assistant code { background: #333; padding: 1px 4px; border-radius: 4px; font: 13px ui-monospace, Menlo, monospace; overflow-wrap: anywhere; word-break: break-all; }
  .assistant a { color: #6cb6ff; overflow-wrap: anywhere; word-break: break-all; }
  .assistant pre { background: #111; padding: 8px 10px; border-radius: 8px; overflow-x: auto; font: 12.5px/1.45 ui-monospace, Menlo, monospace; white-space: pre; }
  .hint code, #gateMsg code, #sheet code { display: block; margin-top: 6px; padding: 8px 10px; background: #1a1d23; border-radius: 8px; color: #e6e6e6; font: 12.5px/1.45 ui-monospace, Menlo, monospace; overflow-wrap: anywhere; word-break: break-all; white-space: pre-wrap; }
  .opt .lbl.url, .opt.url .lbl { overflow-wrap: anywhere; word-break: break-all; white-space: pre-wrap; font: 12.5px/1.4 ui-monospace, Menlo, monospace; }
  .assistant table { border-collapse: collapse; display: block; overflow-x: auto; font-size: 13px; margin: 0 0 .6em; }
  .assistant td, .assistant th { border: 1px solid #444; padding: 4px 6px; }
  .assistant blockquote { margin: 0 0 .6em; padding-left: 10px; border-left: 3px solid #555; color: #aaa; }
  /* Process timeline — muted activity lines like Cursor 3.23 Agents */
  .tool, .step, .thinking { font: 13px/1.45 -apple-system, system-ui, sans-serif; color: #9aa3b2; cursor: pointer; }
  .tool { background: transparent; border: none; border-radius: 0; padding: 3px 2px 3px 0; margin: 1px 0; }
  .step { background: transparent; border: none; padding: 8px 2px 4px; margin: 6px 0 2px; font-weight: 600; color: #c5cdd8; }
  .step.tk-work { color: #8b93a0; font-weight: 500; font-size: 12.5px; margin-top: 12px; }
  .step.tk-explore, .step.doing { color: #b8c0cc; }
  .tool .chev, .thinking .chev, .step .chev { flex: none; font-size: 11px; color: #5c6573; transition: transform .15s; margin-top: 2px; }
  .msg.open > .row .chev { transform: rotate(90deg); }
  .thinking .think-b { display: none; }
  .thinking.open .think-b { display: block; }
  .tool .row, .step .row, .thinking .row { display: flex; align-items: flex-start; gap: 7px; }
  .tool .ico, .step .ico, .thinking .ico { flex: none; width: 1em; text-align: center; font-size: 12px; line-height: 1.45; opacity: .85; }
  .tool .txt, .step .txt { flex: 1; min-width: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; }
  .tool .txt .act { color: #8b93a0; margin-right: .35em; }
  .tool .txt .det { color: #b4bcc8; }
  .tool.open .txt { display: block; -webkit-line-clamp: unset; }
  .tool .st, .step .st, .thinking .st { display: none; }
  .tool.doing .ico, .step.doing .ico, .thinking.doing .ico { animation: pulse 1.2s ease-in-out infinite; color: #8ab4f8; }
  @keyframes pulse { 50% { opacity: .35; } }
  .tool.tk-ran .ico { color: #c8c47a; }
  .tool.tk-read .ico { color: #7eb6d9; }
  .tool.tk-edit .ico { color: #c98870; }
  .tool.tk-search .ico { color: #b07eac; }
  .tool.tk-explore .ico, .step.tk-explore .ico { color: #4ec9b0; }
  .tool.tk-todo .ico { color: #8ab4f8; }
  .step .txt { -webkit-line-clamp: 2; }
  .msg.nest { margin: 0 0 0 14px; padding-left: 10px; position: relative; }
  .msg.nest::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 1px; background: #2f3642; }
  .msg.nest + .msg:not(.nest):not(.step) { margin-top: 10px; }
  .meta { font-size: 11.5px; color: #66707e; padding: 10px 2px 2px; }
  .tool .detail, .step .detail { display: none; margin-top: 6px; padding: 8px 10px; border-radius: 8px; background: #1a1d23; border: 1px solid #2a2f38; color: #b8c0cc; white-space: pre-wrap; max-height: 40vh; overflow: auto; font: 12px/1.45 ui-monospace, Menlo, monospace; }
  .tool .detail.diff, .step .detail.diff, #vBody .diff { font: 12px/1.45 ui-monospace, Menlo, monospace; }
  .tool .detail .dl.add, .step .detail .dl.add, #vBody .dl.add { color: #73c991; background: #1c3a28; }
  .tool .detail .dl.del, .step .detail .dl.del, #vBody .dl.del { color: #f14c4c; background: #3a1c1c; }
  .tool .detail .dl, .step .detail .dl, #vBody .dl { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 4px; }
  .tool.open .detail, .step.open .detail { display: block; }
  .tool .more, .step .more { font-size: 11px; color: #5a8ab8; margin-top: 2px; }
  .tool.open .more, .step.open .more { display: none; }
  .thinking { background: transparent; border: none; padding: 4px 2px; color: #8b919a; }
  #todoBar { flex: none; display: none; flex-direction: column; gap: 4px; padding: 8px 12px; background: #1e2430; border-top: 1px solid #334; max-height: 28vh; overflow-y: auto; }
  #todoBar.show { display: flex; }
  #todoBar .th { font-size: 12px; color: #8ab4f8; font-weight: 600; }
  #todoBar .ti { font-size: 13px; color: #ccc; display: flex; gap: 8px; align-items: flex-start; }
  #todoBar .ti b { flex: none; font-weight: 600; width: 1.1em; text-align: center; }
  #todoBar .ti.done { color: #7a7a7a; text-decoration: line-through; }
  #todoBar .ti.doing b { color: #4af; }
  #todoBar .ti.done b { color: #73c991; }
  #todoBar .ti.pending b { color: #888; }
  .thinking, .other { font-size: 12px; color: #9aa0a6; padding: 6px 9px; background: #1a1d23; border: 1px solid #2a2f38; border-radius: 8px; }
  .thinking .txt { flex: 1; color: #8b919a; }
  .thinking .think-b { display: none; font-size: 13px; color: #9aa0a6; padding: 6px 8px; margin: 6px 0 0; border-left: 2px solid #555; white-space: pre-wrap; }
  .thinking.open .think-b { display: block; }
  .thinking .think-b p { margin: 0 0 .45em; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .btns button { font-size: 13px; padding: 5px 10px; }
  .btns button.primary { font-weight: 600; }
  #empty { color: #888; text-align: center; margin-top: 30vh; padding: 0 20px; }
  #toBottom { position: absolute; right: 14px; bottom: 12px; border-radius: 20px; padding: 6px 12px; background: #333d; display: none; }
  #approveBar { flex: none; display: none; flex-direction: column; gap: 8px; padding: 10px 12px 6px; background: #2a2620; border-top: 2px solid #e5c07b; max-height: 42vh; overflow-y: auto; }
  #approveBar.show { display: flex; }
  #approveBar .apCard { display: flex; flex-direction: column; gap: 4px; }
  #approveBar .apHead { font-size: 12.5px; color: #e5c07b; font-weight: 600; }
  #approveBar .apSum { font-size: 12px; color: #b8a88a; }
  #approveBar .apDetail { margin: 0; padding: 8px 10px; border-radius: 8px; background: #1a1d23; border: 1px solid #3a3220; color: #e6e6e6; font: 12.5px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-all; max-height: 28vh; overflow-y: auto; }
  #actionBar { flex: none; display: none; gap: 8px; flex-wrap: wrap; padding: 8px 12px; background: #2a2d2e; border-top: 1px solid #333; }
  #actionBar.show { display: flex; }
  #actionBar button { flex: 1; padding: 9px; font-weight: 600; }
  #actionBar button.primary { background: #0e639c; border-color: #1177bb; color: #fff; }
  #queueBar { flex: none; display: none; flex-direction: column; gap: 6px; padding: 7px 12px; background: #23272e; border-top: 1px solid #333; max-height: 34vh; overflow-y: auto; }
  #queueBar.show { display: flex; }
  #qnBar { flex: none; display: none; flex-direction: column; gap: 8px; padding: 10px 12px; background: #2a2620; border-top: 2px solid #e5c07b; max-height: 48vh; overflow-y: auto; }
  #qnBar.show { display: flex; }
  #qnBar .qnHead { font-size: 12.5px; color: #e5c07b; font-weight: 600; }
  #qnBar .qnQ { font-size: 14.5px; color: #eee; white-space: pre-wrap; }
  #qnBar .qnOpts { display: flex; flex-direction: column; gap: 6px; }
  #qnBar .qnOpt { text-align: left; font-size: 14px; padding: 8px 10px; display: flex; gap: 8px; }
  #qnBar .qnOpt b { color: #999; flex: none; }
  #qnBar .qnOpt.on { border-color: #e5c07b; background: #3a3220; }
  #qnBar .qnOpt.on b { color: #e5c07b; }
  #qnBar .qnFree { display: flex; gap: 6px; }
  #qnBar .qnFree input { flex: 1; min-width: 0; font-size: 14px; }
  #qnBar .qnFree.on input { border-color: #e5c07b; }
  #qnBar .qnAct { display: flex; gap: 8px; justify-content: flex-end; }
  #qnBar .qnAct button { padding: 7px 16px; }
  #qnBar .qnAct .primary { background: #0e639c; border-color: #1177bb; color: #fff; font-weight: 600; }
  #qnBar .qnAct .primary:disabled { opacity: .45; }
  #queueBar .run { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #9cc8ff; }
  #queueBar .run span { flex: 1; min-width: 0; }
  #queueBar .run i { width: 8px; height: 8px; border-radius: 50%; background: #4af; flex: none; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }
  #queueBar .qh { font-size: 12px; color: #999; }
  #queueBar .qh.fold { background: none; border: none; padding: 2px 0; text-align: left; color: #9cc8ff; font-size: 12.5px; }
  #queueBar .q { display: flex; align-items: center; gap: 6px; font-size: 13.5px; }
  #queueBar .q .qt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #ccc; }
  #queueBar .q .qt::before { content: "○ "; color: #777; }
  #queueBar .q .qt.sa::before { content: "⇢ "; color: #4af; }
  #queueBar .run.sub { color: #e5c07b; }
  #queueBar button { font-size: 12px; padding: 3px 9px; flex: none; }

  /* screen view */
  .tools { flex: none; display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto; scrollbar-width: none; background: #252526; border-bottom: 1px solid #333; min-width: 0; }
  .tools::-webkit-scrollbar { display: none; }
  #view { flex: 1; min-height: 0; overflow: auto; background: #111; -webkit-overflow-scrolling: touch; }
  #stage { position: relative; overflow: hidden; margin: 0 auto; }
  #screen { position: absolute; left: 0; top: 0; max-width: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-x pan-y; }
  #view.scroll #screen { touch-action: none; }
  #ripple { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 2px solid #4af; pointer-events: none; opacity: 0; transition: opacity .4s; }

  /* composer */
  footer { flex: none; background: #252526; border-top: 1px solid #333; padding: 6px 10px 8px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  #chatTools { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
  #chatTools::-webkit-scrollbar { display: none; }
  #chatTools button { font-size: 12.5px; padding: 3px 10px; border-radius: 14px; flex: none; white-space: nowrap; }
  #chatTools #pickModel { flex: 0 1 auto; min-width: 84px; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; gap: 8px; min-width: 0; align-items: flex-end; }
  textarea { flex: 1; min-width: 0; min-height: 40px; max-height: 32vh; padding: 9px 10px; resize: none; font-size: 16px; line-height: 1.35; }
  #img { flex: none; height: 40px; width: 40px; padding: 0; display: flex; align-items: center; justify-content: center; color: #bbb; }
  #mic { display: none; }
  body.voice #mic { flex: none; height: 40px; width: 40px; padding: 0; display: flex; align-items: center; justify-content: center; color: #bbb; }
  #mic.on { color: #fff; background: #c33; border-color: #e55; animation: pulse 1.2s ease-in-out infinite; }
  #send { flex: none; height: 40px; padding: 0 16px; background: #0e639c; border-color: #1177bb; color: #fff; font-weight: 600; }
  #msg { font-size: 12px; color: #888; min-height: 14px; overflow-wrap: anywhere; word-break: break-all; white-space: pre-wrap; max-height: 6.5em; overflow-y: auto; }
  #msg.err { color: #f77; }

  /* bottom sheet */
  #shade { position: fixed; inset: 0; z-index: 30; background: #0008; display: none; }
  #shade.open { display: block; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: #252526; border-radius: 14px 14px 0 0; padding: 12px 12px calc(14px + env(safe-area-inset-bottom)); max-height: 75dvh; overflow-y: auto; transform: translateY(105%); transition: transform .2s; }
  #sheet.open { transform: none; }
  #sheet h3 { margin: 2px 4px 10px; font-size: 15px; color: #ccc; font-weight: 600; }
  .opt { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 11px 12px; margin-bottom: 6px; white-space: normal; }
  .opt .lbl { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .opt .sub { display: block; font-size: 12px; color: #888; margin-top: 2px; }
  .opt .tag { flex: none; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #3a3d41; color: #bbb; }
  .opt.cur { border-color: #1177bb; }
  .opt.cur::after { content: "✓"; color: #4af; flex: none; }
  .askQ { white-space: pre-line; line-height: 1.5; margin: 6px 4px 16px !important; color: #e6e6e6 !important; }
  .askBtns { display: flex; gap: 10px; }
  .askBtns button { flex: 1; padding: 12px; font-size: 15px; }
  button.danger { background: #a1260d; border-color: #c4321a; color: #fff; font-weight: 600; }
  .optRow { display: flex; gap: 6px; align-items: stretch; margin-bottom: 6px; }
  .optRow .opt { margin-bottom: 0; flex: 1; min-width: 0; }
  .paramBtn { flex: none; padding: 0 12px; font-size: 13px; }
  .switch { flex: none; width: 36px; height: 20px; border-radius: 10px; background: #555; position: relative; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #ddd; transition: left .15s; }
  .switch.on { background: #0e639c; }
  .switch.on::after { left: 18px; }
  .sub .add { color: #73c991; }
  .sub .del { color: #f14c4c; }
  .pSec { font-size: 12px; color: #999; margin: 10px 4px 6px; }
  .pRow { display: flex; flex-wrap: wrap; gap: 6px; }
  .pRow button { padding: 8px 12px; font-size: 13.5px; }
  .pRow button.on { border-color: #1177bb; background: #0e639c; color: #fff; }
  .hint { font-size: 13px; color: #999; margin: 4px 4px 10px; line-height: 1.6; }
  .qrs { display: flex; gap: 10px; margin: 4px 0 10px; }
  .qrs figure { flex: 1; min-width: 0; margin: 0; text-align: center; font-size: 13px; color: #aaa; }
  .qrs img { display: block; width: 100%; border-radius: 10px; margin-bottom: 4px; }
  a.opt { color: #e6e6e6; text-decoration: none; background: #2d2d2d; border: 1px solid #3c3c3c; border-radius: 8px; box-sizing: border-box; }

  /* file links + viewer */
  .assistant code[data-file], .tool[data-file] { cursor: pointer; }
  .assistant code[data-file] { color: #6cb6ff; text-decoration: underline; text-decoration-color: #6cb6ff66; text-underline-offset: 2px; }
  .tool[data-file] .txt::before { content: "📄 "; }
  #viewer { position: fixed; inset: 0; z-index: 40; background: #1e1e1e; display: none; flex-direction: column;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #viewer.open { display: flex; }
  #viewer .bar { flex: none; display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #252526; border-bottom: 1px solid #333; min-width: 0; }
  #viewer .names { flex: 1; min-width: 0; line-height: 1.25; }
  #vName { font-size: 14px; color: #eee; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #vPath { font-size: 11px; color: #888; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  #vBody { flex: 1; min-height: 0; overflow: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  #vBody .code { font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 6px 0 40px; min-width: max-content; }
  #vBody.wrap .code { min-width: 0; }
  #vBody .l { display: flex; white-space: pre; }
  #vBody.wrap .l { white-space: pre-wrap; overflow-wrap: anywhere; }
  #vBody .l i { flex: none; width: 3.6em; padding-right: 10px; text-align: right; color: #5a5a5a; font-style: normal; user-select: none; -webkit-user-select: none; }
  #vBody .l.hl { background: #264f7855; }
  #vBody img { display: block; max-width: 100%; margin: 12px auto; background: #fff1; }
  #vBody .note { padding: 30px 20px; color: #999; text-align: center; line-height: 1.7; }
  #vBody .note.err { color: #f77; }

  /* gate (login / offline) */
  #gate { position: fixed; inset: 0; z-index: 20; background: #1e1e1e; display: none; flex-direction: column; gap: 12px; padding: calc(60px + env(safe-area-inset-top)) 24px 24px; }
  #gate.open { display: flex; }
  #gate h2 { margin: 0 0 6px; font-size: 20px; color: #eee; }
  #gate input { font-size: 16px; padding: 11px; }
  #gate button { padding: 11px; }
  #gateMsg { color: #aaa; line-height: 1.6; white-space: pre-line; }
  .primary-link { display: block; text-align: center; padding: 11px; border-radius: 8px; background: #0e639c; color: #fff; text-decoration: none; font-weight: 600; }
  #gateInput.code { font-size: 26px; letter-spacing: 8px; text-align: center; }
  #gateMsg.err { color: #f77; }
  #gateInfo { font-size: 12px; color: #777; }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <button id="title"><span id="titleText">连接中…</span></button>
  <div class="seg">
    <button id="tabChat" class="on">对话</button>
    <button id="tabScreen">画面</button>
  </div>
  <button id="menuBtn">⋯</button>
</header>

<main>
  <section id="chatView" class="view active">
    <div id="list">
      <button id="older">↑ 加载更早的消息</button>
      <div id="items"></div>

<div id="gate">
  <h2>Cursor Remote</h2>
  <div id="gateMsg"></div>
  <input id="gateInput" autocapitalize="off" autocorrect="off" spellcheck="false">
  <button id="gateBtn" class="primary"></button>

  <button id="gateRetry">重试</button>
  <div id="gateInfo"></div>

<script src="i18n.js"></script>
<script>
const $ = id => document.getElementById(id);
const PRIMARY = /^(run|allow|accept|approve|keep|continue|build|yes|运行|允许|接受|继续)/i;
const store = {
  get: k => localStorage.getItem('cr-' + k),
  set: (k, v) => v == null ? localStorage.removeItem('cr-' + k) : localStorage.setItem('cr-' + k, v),
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const sleep = ms => new Promise(r => setTimeout(r, ms));

let base = null, info = null, ws = null, authed = false, failures = 0;
let mode = store.get('mode') || 'chat';
let crop = store.get('crop') !== 'full';
let frame = { w: 1000, h: 800 }, panel = null, zoom = 1, tapMode = 'tap', rightNext = false;
let windows = [], currentWindow = null, currentAgent = '';

// Keep the layout above the on-screen keyboard.
function fitViewport() {
  const vv = window.visualViewport;
  if (vv) document.body.style.height = vv.height + 'px';
}
window.visualViewport?.addEventListener('resize', fitViewport);
fitViewport();

function status(text, ok = true) {
  $('msg').textContent = text;
  $('msg').className = ok ? '' : 'err';
}

function send(obj) {
  if (ws && ws.readyState === 1 && authed) ws.send(JSON.stringify(obj));
  else status('未连接', false);
}

/* ---------- gate: pairing / 2FA / offline ---------- */
let gateSubmit = null;
function gate({ msg = '', err = false, input = null, retry = false, appLink = null } = {}) {
  $('gate').classList.add('open');
  $('gateMsg').textContent = msg;
  $('gateMsg').className = err ? 'err' : '';
  const inp = $('gateInput');
  inp.hidden = $('gateBtn').hidden = !input;
  gateSubmit = input?.submit || null;
  if (input) {
    inp.value = '';
    inp.placeholder = input.placeholder;
    inp.className = input.code ? 'code' : '';
    inp.inputMode = input.code ? 'numeric' : 'url';
    inp.autocomplete = input.code ? 'one-time-code' : 'off';
    $('gateBtn').textContent = input.button;
    if (input.code) setTimeout(() => inp.focus(), 50);
  }
  $('gateApp').hidden = !appLink;
  if (appLink) $('gateApp').href = appLink;
  $('gateRetry').hidden = !retry;
  $('gateRetry').textContent = typeof retry === 'string' ? retry : '重试';
  $('gateInfo').textContent = info?.updated ? '电脑端地址更新于 ' + new Date(info.updated).toLocaleString() : '';
}
const ungate = () => $('gate').classList.remove('open');
$('gateBtn').onclick = () => gateSubmit?.($('gateInput').value.trim());
$('gateInput').onkeydown = e => { if (e.key === 'Enter') $('gateBtn').click(); };
$('gateRetry').onclick = () => boot();

/* ---------- relay discovery & auth ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64u = s => b64(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4));

// On GitHub Pages, url.json holds the relay address encrypted with a random key that only paired devices hold.
async function decryptUrl(keyText) {
  const key = await crypto.subtle.importKey('raw', b64u(keyText), 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(info.iv) }, key, b64(info.data));
  return JSON.parse(new TextDecoder().decode(plain)).url;
}

const offline = msg => Object.assign(new Error(msg), { offline: true });
async function resolveBase() {
  if (info.self) return location.origin;
  if (info.v !== 2 || !info.data) throw offline('电脑端还没有发布地址（或还在用旧版本），请在电脑上重启服务');
  const key = store.get('key');
  if (!key) throw Object.assign(new Error(''), { unpaired: true });
  try { return await decryptUrl(key); } catch { throw Object.assign(new Error('配对信息已失效（电脑端重置过），请重新配对'), { unpaired: true, stale: true }); }
}

async function api(path, opts = {}) {
  const headers = { 'content-type': 'application/json', ...(store.get('token') ? { authorization: 'Bearer ' + store.get('token') } : {}) };
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 10000);
  try {
    return await fetch(base + path, { ...opts, headers, signal: ctl.signal, cache: 'no-store' });
  } finally {
    clearTimeout(timer);
  }
}
const post = (path, body) => api(path, { method: 'POST', body: JSON.stringify(body || {}) });

// Pairing links look like <app>#pair=<url key>.<one-time code>.
function parsePair(text) {
  const m = /[#&]pair=([\w-]{43})\.([\w-]{16,})/.exec(text || '');
  return m ? { key: m[1], code: m[2] } : null;
}
let pending = parsePair(location.hash);
if (pending) history.replaceState(null, '', location.pathname + location.search);
// Opened from a notification: <app>#win=<window id>.
{
  const m = /[#&]win=([^&]+)/.exec(location.hash);
  if (m) {
    store.set('window', decodeURIComponent(m[1]));
    history.replaceState(null, '', location.pathname + location.search);
  }
}
window.addEventListener('hashchange', () => {
  const p = parsePair(location.hash);
  if (!p) return;
  history.replaceState(null, '', location.pathname + location.search);
  pending = p;
  boot();
});
store.set('pw', null);

function deviceName() {
  const ua = navigator.userAgent;
  const model = /Android [\d.]+; (?:[a-z]{2}-[a-z]{2}; )?([^;)]+?)(?: Build|\))/i.exec(ua)?.[1];
  const kind = inApp ? '安卓 App' : /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? '安卓浏览器' : /Mac/.test(ua) ? 'Mac 浏览器' : '浏览器';
  return model && !/^K$/.test(model) ? `${model}（${kind}）` : kind;
}

function showUnpaired(msg = '') {
  const iosHome = standalone() && /iPhone|iPad|iPod/.test(navigator.userAgent);
  const tip = iosHome
    ? '主屏幕 App 需要单独配对：把电脑上的配对链接粘贴到下面（不要用 Safari 里已配对的状态）。'
    : '这台设备还没有配对。\n在电脑上运行 npm run pair，用手机扫码；或者把链接复制过来粘贴到下面。';
  gate({
    msg: (msg ? msg + '\n\n' : '') + tip,
    err: !!msg,
    input: { placeholder: '粘贴配对链接', button: '配对', submit: pastePair },
  });
}

function pastePair(text) {
  const p = parsePair(text);
  if (!p) return showUnpaired('这不是配对链接（应包含 #pair=…）');
  let target;
  try { target = new URL(text.trim()); } catch {}
  const here = location.origin + location.pathname;
  // A link for another app address: switch to it (the Android app remembers the new address).
  if (target && /^https?:$/.test(target.protocol) && target.origin + target.pathname !== here) {
    if (inApp) return window.CursorRemoteApp.setUrl(target.href);
    location.href = target.href;
    return;
  }
  pending = p;
  boot();
}

function showTotp(onCode, err = '') {
  gate({
    msg: (err ? err + '\n' : '') + '请输入 Authenticator 里「Cursor Remote」的 6 位验证码',
    err: !!err,
    input: { placeholder: '000000', button: '验证', code: true, submit: onCode },
  });
}

async function pair(totp) {
  gate({ msg: '正在配对…' });
  let r, body;
  try {
    r = await post('/api/pair', { code: pending.code, name: deviceName(), totp });
    body = await r.json().catch(() => ({}));
  } catch {
    return gate({ msg: '连不上电脑，配对链接 10 分钟内有效，稍后重试', err: true, retry: true });
  }
  if (r.ok) {
    store.set('token', body.token);
    pending = null;
    // iOS: offer handoff so Add to Home Screen does not lose the session.
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !standalone()) {
      connect();
      setTimeout(() => showInstallHelp().catch(() => {}), 400);
      return;
    }
    return connect();
  }
  if (body.needTotp) return showTotp(code => pair(code), body.error);
  pending = null;
  if (store.get('token')) return gate({ msg: (body.error || '配对失败') + '\n\n这台设备之前已经配对过，可以继续使用。', err: true, retry: '继续使用' });
  showUnpaired(body.error || '配对失败');
}

async function verifyTotp(code) {
  gate({ msg: '正在验证…' });
  try {
    const r = await post('/api/totp', { code });
    const body = await r.json().catch(() => ({}));
    if (r.ok) return connect();
    showTotp(verifyTotp, body.error || '验证失败');
  } catch {
    gate({ msg: '连不上电脑', err: true, retry: true });
  }
}

// App root on GitHub Pages is /<repo>/, not /. Absolute "/" would open the wrong site from the home screen.
const appRoot = () => new URL('./', location.href);
const appRootPath = () => appRoot().pathname;

// iOS home-screen apps have a separate localStorage from Safari.
// Prefer path /h/<code> on the relay; on GitHub Pages use ?h= (Pages cannot serve /h/*).
function handoffCodeFromLocation() {
  const path = /(?:^|\/)h\/([\w-]{20,})\/?$/.exec(location.pathname);
  if (path) return path[1];
  const q = /[?&]h=([\w-]{20,})/.exec(location.search);
  return q ? q[1] : null;
}

function handoffKeyFromLocation() {
  const q = /[?&]k=([\w-]{40,})/.exec(location.search);
  return q ? q[1] : null;
}

async function takeHandoff() {
  const code = handoffCodeFromLocation();
  const k = handoffKeyFromLocation();
  if (k) store.set('key', k);
  if (!code) return false;
  // Safari is already logged in: keep handoff URL for "Add to Home Screen", do not consume yet.
  if (store.get('token')) return false;
  if (!base) return false;
  try {
    const r = await fetch(base.replace(/\/?$/, '/') + 'api/handoff/redeem', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ code }),
      cache: 'no-store',
    });
    const body = await r.json().catch(() => ({}));
    if (!r.ok || !body.key || !body.token) return false;
    store.set('key', body.key);
    store.set('token', body.token);
    history.replaceState(null, '', appRootPath());
    return true;
  } catch {
    return false;
  }
}

function setInstallManifest(startUrl) {
  // iOS uses manifest start_url for the home-screen icon, not the page you were viewing.
  // Blob manifests need absolute URLs; keep scope under the app directory (GitHub Pages subpath).
  const root = appRoot();
  const start = new URL(startUrl || './', root).href;
  const man = {
    name: 'Cursor Remote',
    short_name: 'Cursor Remote',
    description: '在手机上查看和操作电脑上的 Cursor',
    start_url: start,
    scope: root.href,
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#1e1e1e',
    theme_color: '#1e1e1e',
    lang: 'zh-CN',
    icons: [
      { src: new URL('icon-192.png', root).href, sizes: '192x192', type: 'image/png', purpose: 'any' },
      { src: new URL('icon-512.png', root).href, sizes: '512x512', type: 'image/png', purpose: 'any maskable' },
    ],
  };
  let link = document.querySelector('link[rel="manifest"]');
  if (!link) {
    link = document.createElement('link');
    link.rel = 'manifest';
    document.head.appendChild(link);
  }
  if (link.dataset.blob) URL.revokeObjectURL(link.dataset.blob);
  const blob = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
  link.dataset.blob = blob;
  link.href = blob;
}

async function prepareHomeScreenHandoff() {
  if (!store.get('token') || !base) return null;
  const r = await post('/api/handoff', { key: store.get('key') || '' });
  const body = await r.json().catch(() => ({}));
  if (!r.ok || !body.code) throw new Error(body.error || '生成迁移码失败');
  const key = store.get('key') || '';
  // Relay can serve /h/<code>; GitHub Pages cannot — use ?h= so the icon opens this app.
  const onPages = !info?.self;
  const start = onPages
    ? `./?h=${body.code}${key ? '&k=' + encodeURIComponent(key) : ''}`
    : `/h/${body.code}`;
  const url = new URL(start, appRoot()).href;
  history.replaceState(null, '', url);
  setInstallManifest(start);
  return { url, minutes: body.minutes || 30 };
}

async function boot() {
  authed = false;
  clearTimeout(retryTimer);
  // Android browser opened a pairing link: offer to hand it to the installed app instead.
  if (pending && /Android/.test(navigator.userAgent) && !inApp && !pending.stay) {
    const link = `cursorremote://pair?app=${encodeURIComponent(location.origin + location.pathname)}&d=${pending.key}.${pending.code}`;
    gate({ msg: '已收到配对链接。\n装了安卓 App 就在 App 里打开；否则直接在浏览器里用。', appLink: link, retry: '在浏览器里继续' });
    pending.stay = true;
    return;
  }
  gate({ msg: '正在查找电脑…' });
  try {
    const r = await fetch('url.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('http ' + r.status);
    info = await r.json();
  } catch {
    // Opened on the relay/tunnel itself: treat as self even if url.json briefly 502s.
    if (/lhr\.life$|:3939$|trycloudflare\.com$/.test(location.host) || location.port === '3939') {
      info = { self: true };
    } else {
      autoRetry();
      return gate({ msg: '读取失败，请检查手机网络（公网地址可能已更新，请重新扫电脑上的码）', err: true, retry: true });
    }
  }
  // Handoff may carry the url-key in ?k= so GitHub Pages can decrypt before redeeming.
  const hk = handoffKeyFromLocation();
  if (hk) store.set('key', hk);
  if (pending) store.set('key', pending.key);
  try {
    base = await resolveBase();
  } catch (e) {
    if (e.offline) return gate({ msg: e.message, retry: true });
    if (e.stale) { store.set('key', null); store.set('token', null); }
    return showUnpaired(e.message);
  }
  await takeHandoff();
  if (pending) return pair();
  if (!store.get('token')) return showUnpaired();
  let me;
  try {
    me = await api('/api/me').then(r => r.json());
  } catch {
    autoRetry();
    return gate({ msg: '电脑不在线：可能关机、睡眠，或服务刚重启（新地址约 1 分钟后生效）。会自动重试…', retry: true });
  }
  if (!me.paired) {
    store.set('token', null);
    return showUnpaired('这台设备已被移除，请重新配对');
  }
  if (me.needTotp) return showTotp(verifyTotp);
  connect();
}

let retryTimer = null;
function autoRetry() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => { if (!authed) boot(); }, 15000);
}

let hbTimer = null;
let lastPongAt = 0;
let connGen = 0;
let reconnecting = false;
function stopHeartbeat() { clearInterval(hbTimer); hbTimer = null; }
function startHeartbeat() {
  stopHeartbeat();
  lastPongAt = Date.now();
  // Faster than tunnel idle cutoffs (~60–100s); miss 3 beats → force reconnect.
  hbTimer = setInterval(() => {
    if (!ws || ws.readyState !== 1 || !authed) return;
    if (Date.now() - lastPongAt > 35000) {
      status('连接无响应，重连中…', false);
      try { ws.close(); } catch {}
      return;
    }
    try { ws.send(JSON.stringify({ t: 'ping', ts: Date.now() })); } catch {}
  }, 10000);
}

function ensureConnected() {
  if (reconnecting) return;
  if (ws && (ws.readyState === 0 || ws.readyState === 1) && authed) {
    try { ws.send(JSON.stringify({ t: 'ping', ts: Date.now() })); } catch {}
    return;
  }
  if (store.get('token') && base) connect();
}

function connect() {
  clearTimeout(retryTimer);
  stopHeartbeat();
  const gen = ++connGen;
  reconnecting = true;
  try { ws?.close(); } catch {}
  ws = new WebSocket(base.replace(/^http/, 'ws') + '/ws');
  const mine = ws;
  ws.onopen = () => {
    if (gen !== connGen || ws !== mine) return;
    ws.send(JSON.stringify({ t: 'auth', token: store.get('token') }));
  };
  let rejected = false;
  ws.onerror = () => { /* onclose handles retry */ };
  ws.onclose = async () => {
    if (gen !== connGen) return;
    stopHeartbeat();
    reconnecting = false;
    $('dot').className = '';
    if (!authed) {
      // boot() asks /api/me whether the device was removed or needs 2FA again.
      await sleep(rejected ? 0 : 1500);
      if (gen !== connGen) return;
      return boot();
    }
    authed = false;
    failures++;
    status('断开，重连中…', false);
    const wait = Math.min(6000, 400 * failures + Math.floor(Math.random() * 300));
    await sleep(wait);
    if (gen !== connGen) return;
    // After repeated failures the relay/tunnel may have moved — rediscover.
    if (failures >= 2) { failures = 0; return boot(); }
    connect();
  };
  ws.onmessage = ev => {
    if (gen !== connGen || ws !== mine) return;
    const m = JSON.parse(ev.data);
    if (m.t === 'pong') { lastPongAt = Date.now(); return; }
    if (m.t === 'auth') {
      if (!m.ok) { rejected = true; return; }
      authed = true; failures = 0; reconnecting = false;
      lastPongAt = Date.now();
      ungate();
      $('dot').className = 'ok';
      status('已连接');
      startHeartbeat();
      send({ t: 'mode', mode });
      send({ t: 'windows' });
      const fromNotice = window.CursorRemoteApp?.takeOpenWin?.();
      if (fromNotice) store.set('window', fromNotice);
      send({ t: 'attach', id: store.get('window') || '' });
      sentWidth = 0;
      applyQuality();
      send({ t: 'visible', v: document.visibilityState === 'visible' });
      send({ t: 'lang', v: I18N.lang });
      syncNotify();
      setTimeout(checkAppUpdate, 3000);
    }
    else if (m.t === 'chat') {
      try { renderChat(m.chat); } catch (e) { console.log(e); }
    }
    else if (m.t === 'frame') onFrame(m);
    else if (m.t === 'panel') { panel = m.rect; layoutStage(); applyQuality(); }
    else if (m.t === 'windows') { windows = m.list; currentWindow = m.current; currentAgent = m.agent || currentAgent; if (sheetKind === 'windows') showWindows(); }
    else if (m.t === 'attached') {
      store.set('window', m.id);
      currentWindow = m.id;
      currentAgent = m.agent || '';
      $('titleText').textContent = winLabel(m.title).name;
      send({ t: 'windows' });
    }
    else if (m.t === 'menu') showMenu(m.kind, m.items, m.max);
    else if (m.t === 'params') showParams(m);
    else if (m.t === 'changes') showChanges(m);
    else if (m.t === 'file') { if (inlineCard) showInlineFile(m); else showFile(m); }
    else if (m.t === 'itemDetail') {
      const el = [...itemsEl.children].find(e => e.dataset.i === String(m.i));
      if (!el) return;
      if (el.classList.contains('thinking') && m.h) fillCard(el, m.h);
      else if (m.d) fillCard(el, el.dataset.diff ? diffHtml(m.d) : esc(m.d), el.dataset.diff);
      else if (m.h) fillCard(el, m.h);
      else fillCard(el, '<div class="more">没有读到详情（可能已折叠）</div>');
    }
    else if (m.t === 'status') status(m.msg, m.ok);
  };
}

/* ---------- bottom sheet ---------- */
let sheetKind = null;
function openSheet(kind, html) {
  sheetKind = kind;
  $('sheet').innerHTML = html;
  $('shade').classList.add('open');
  $('sheet').classList.add('open');
}
function closeSheet() {
  sheetKind = null;
  $('shade').classList.remove('open');
  $('sheet').classList.remove('open');
}
$('shade').onclick = () => { closeSheet(); askDone?.(false); };

// Confirmation for anything that interrupts the Agent or throws work away; resolves false if dismissed.
let askDone = null;
function ask(question, ok = '确定') {
  askDone?.(false);
  return new Promise(resolve => {
    askDone = v => { askDone = null; resolve(v); };
    openSheet('ask', `<h3 class="askQ">${esc(question)}</h3><div class="askBtns">`
      + `<button id="askNo">取消</button><button id="askOk" class="danger">${esc(ok)}</button></div>`);
    $('askOk').onclick = () => { closeSheet(); askDone?.(true); };
    $('askNo').onclick = () => { closeSheet(); askDone?.(false); };
  });
}
// Buttons on Cursor's own cards that stop, reject or discard work.
const RISKY = /^(stop|reject|deny|undo|discard|revert|cancel|delete|remove|停止|拒绝|撤销|丢弃|取消|删除)/i;

const KIND_TAG = { agents: 'Agents', ssh: 'SSH', local: '本地' };

// Cursor titles look like "file.py — Folder [SSH: host]"; the window is identified by folder (+ host), not the open file.
function winLabel(title) {
  const host = /\[SSH: ([^\]]+)\]/.exec(title)?.[1];
  const parts = title.replace(/\s*\[SSH: [^\]]+\]\s*$/, '').split(' — ').map(s => s.replace(/^●\s*/, '').trim());
  const folder = parts.pop() || title;
  return { name: host ? `${folder} · ${host}` : folder, file: parts.join(' — ') };
}

function showWindows() {
  const ordered = [...windows].sort((a, b) => {
    const ac = a.agent ? (a.current || a.agent === currentAgent) : (a.id === currentWindow && !currentAgent);
    const bc = b.agent ? (b.current || b.agent === currentAgent) : (b.id === currentWindow && !currentAgent);
    return (bc ? 1 : 0) - (ac ? 1 : 0);
  });
  const rows = ordered.map(w => {
    const cur = w.agent ? w.current || w.agent === currentAgent : w.id === currentWindow && !currentAgent;
    const label = w.agent || winLabel(w.title || w.id).name;
    const sub = w.agent
      ? (cur ? '<span class="sub">当前</span>' : '')
      : (winLabel(w.title || '').file ? `<span class="sub">${esc(winLabel(w.title).file)}</span>` : '');
    return `<button class="opt ${cur ? 'cur' : ''}" data-win="${esc(w.id)}" data-agent="${esc(w.agent || '')}">
    <span class="tag">${KIND_TAG[w.kind] || ''}</span><span class="lbl">${esc(label)}${sub}</span></button>`;
  }).join('');
  openSheet('windows', `<h3>切换 Agent / 窗口</h3>${rows || '<div class="hint">没有找到窗口</div>'}`);
}
$('title').onclick = () => { send({ t: 'windows' }); showWindows(); };

const MENU_TITLE = { mode: '选择模式', model: '选择模型', history: '历史对话' };
function showMenu(kind, items, max) {
  if (!items.length) return status('菜单是空的，可能 Cursor 版本不同', false);
  status('');
  const maxRow = typeof max === 'boolean'
    ? `<button class="opt" data-max><span class="lbl">MAX Mode<span class="sub">更大上下文、更贵</span></span><span class="switch ${max ? 'on' : ''}"></span></button>` : '';
  openSheet('menu', `<h3>${MENU_TITLE[kind] || ''}</h3>` + maxRow + items.map(it => {
    const pick = `<button class="opt ${it.checked ? 'cur' : ''}" data-kind="${kind}" data-label="${esc(it.label)}"><span class="lbl">${esc(it.label)}${kind === 'model' && /^auto$/i.test(it.label) ? '<span class="sub">返回自动选择</span>' : ''}</span></button>`;
    return it.params ? `<div class="optRow">${pick}<button class="paramBtn" data-params="${esc(it.id)}" data-plabel="${esc(it.label)}">参数</button></div>` : pick;
  }).join(''));
}

function changeBarLabel(a) {
  if (/^Discard All/i.test(a)) return '全部撤销';
  if (/^Stage All/i.test(a)) return '全部暂存';
  if (/^Keep All/i.test(a)) return '全部保留';
  if (/^Undo All/i.test(a)) return '全部撤销';
  return a;
}

function showChanges(m) {
  status('');
  if (!m.files.length) { if (sheetKind === 'changes') closeSheet(); return status('没有待处理的改动'); }
  const review = Boolean(m.review);
  openSheet('changes', `<h3>改动的文件（${m.files.length}）</h3>`
    + (m.actions?.length ? `<div class="pRow" style="margin-bottom:10px">${m.actions.map(a =>
      `<button data-chbar="${esc(a)}">${esc(changeBarLabel(a))}</button>`).join('')}</div>` : '')
    + m.files.map((f, i) => `<div class="optRow"><button class="opt" data-chopen="${esc(f.name)}"><span class="lbl">${esc(f.name)}`
      + `<span class="sub"><span class="add">${esc(f.add)}</span> <span class="del">${esc(f.del)}</span></span></span></button>`
      + `<button class="paramBtn" data-ch="${i}" data-name="${esc(f.name)}" data-act2="${review ? 'stage' : 'keep'}">${review ? '暂存' : '保留'}</button>`
      + `<button class="paramBtn" data-ch="${i}" data-name="${esc(f.name)}" data-act2="${review ? 'discard' : 'undo'}">撤销</button></div>`).join('')
    + `<div class="hint">点文件名在手机预览。「${review ? '暂存' : '保留'}」接受改动，「撤销」丢弃该文件的改动。</div>`);
}

function showParams(m) {
  status('');
  openSheet('params', `<h3>${esc(m.label || '模型')} 参数</h3>` + m.sections.map(s => `<div class="pSec">${esc(s.title)}</div><div class="pRow">`
    + s.items.map(it => `<button class="${it.checked ? 'on' : ''} ${it.toggle ? 'tg' : ''}" data-model="${esc(m.model)}" data-plabel="${esc(m.label)}" data-section="${esc(s.title)}" data-value="${esc(it.label)}">${esc(it.label)}${it.toggle ? (it.checked ? '：开' : '：关') : ''}</button>`).join('')
    + '</div>').join('') + '<div class="hint">改动会直接应用到电脑上 Cursor 的这个模型。</div>');
}
